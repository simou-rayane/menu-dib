<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ============================================ -->

            projectId: "restaurant-menu-9179b",
            storageBucket: "restaurant-menu-9179b.appspot.com",
            messagingSenderId: "57456460201",

            console.log('✅ Firebase initialisé');
        }
    </script>
    
    <style>
        /* ============================================ */
        /* 🎨 STYLES - MODE SOMBRE PROFESSIONNEL */
        /* ============================================ */
        
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-card-hover: #2d2d2d;
            --bg-modal: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #777777;
            --accent: #e8a838;
            --accent-hover: #f5c14a;
            --accent-glow: rgba(232, 168, 56, 0.15);
            --border-color: #333333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
            padding-bottom: 120px;
        }
        
        /* ============================================ */
        /* 🖼️ BANNIÈRE */
        /* ============================================ */
        .banner-container {
            max-width: 1200px;
            margin: 0 auto 30px;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        .banner-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }
        
        .banner-image:hover {
            transform: scale(1.01);
        }
        
        .banner-placeholder {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 15px;
            font-size: 1.2rem;
        }
        
        .banner-placeholder .icon {
            font-size: 64px;
            opacity: 0.5;
        }
        
        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px 25px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            pointer-events: none;
        }
        
        .banner-overlay .restaurant-name-banner {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
        }
        
        .banner-overlay .restaurant-slogan {
            color: var(--text-secondary);
            font-size: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        /* ============================================ */
        /* 📱 BARRE DE RECHERCHE ET FILTRES */
        /* ============================================ */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 30px;
            position: sticky;
            top: 20px;
            z-index: 100;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        .search-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }
        
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 600;
        }
        
        .filter-btn.active:hover {
            background: var(--accent-hover);
        }
        
        /* ============================================ */
        /* 🍽️ CONTENEUR PRINCIPAL */
        /* ============================================ */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* ============================================ */
        /* 📂 CATÉGORIES */
        /* ============================================ */
        .category-section {
            margin-bottom: 40px;
        }
        
        .category-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            margin-bottom: 20px;
        }
        
        .category-icon {
            font-size: 28px;
        }
        
        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .category-count {
            margin-left: auto;
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        /* ============================================ */
        /* 🍽️ GRILLE DES PRODUITS */
        /* ============================================ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }
        
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-secondary);
            transition: var(--transition);
        }
        
        .product-card:hover .product-image {
            transform: scale(1.02);
        }
        
        .product-body {
            padding: 18px 20px;
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .product-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }
        
        .product-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            background: var(--accent-glow);
            padding: 2px 12px;
            border-radius: 20px;
        }
        
        .product-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* ============================================ */
        /* 🛒 PANIER - MODAL */
        /* ============================================ */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: flex-end;
            animation: fadeIn 0.3s ease;
        }
        
        .cart-overlay.active {
            display: flex;
        }
        
        .cart-modal {
            background: var(--bg-modal);
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        
        .cart-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .cart-header .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            padding: 0 8px;
        }
        
        .cart-header .close-btn:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        
        /* Numéro de table */
        .table-selector {
            padding: 15px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--bg-card);
        }
        
        .table-selector label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .table-selector input {
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            width: 80px;
            text-align: center;
            transition: var(--transition);
        }
        
        .table-selector input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        /* Liste des produits du panier */
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }
        
        .cart-items::-webkit-scrollbar {
            width: 4px;
        }
        .cart-items::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        .cart-items::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            animation: fadeIn 0.3s ease;
        }
        
        .cart-item:hover {
            border-color: var(--accent);
        }
        
        .cart-item-image {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--bg-card);
            flex-shrink: 0;
        }
        
        .cart-item-image-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        
        .cart-item-info {
            flex: 1;
            min-width: 0;
        }
        
        .cart-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        
        .cart-item-price {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        
        .cart-item-quantity button {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cart-item-quantity button:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        
        .cart-item-quantity span {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
        }
        
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        
        .cart-item-remove:hover {
            background: rgba(231, 76, 60, 0.15);
            transform: scale(1.1);
        }
        
        /* Total et actions */
        .cart-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 10px 0;
        }
        
        .cart-total .total-price {
            color: var(--accent);
            font-size: 1.4rem;
        }
        
        .cart-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .cart-actions button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 120px;
        }
        
        .cart-actions .btn-order {
            background: var(--accent);
            color: var(--bg-primary);
            flex: 2;
        }
        
        .cart-actions .btn-order:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        
        .cart-actions .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .cart-actions .btn-clear {
            background: var(--danger);
            color: white;
            flex: 1;
        }
        
        .cart-actions .btn-clear:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        
        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .cart-empty .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 15px;
        }
        
        .cart-empty h3 {
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        /* ============================================ */
        /* 🛒 BOUTON PANIER FLOTTANT */
        /* ============================================ */
        .cart-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(232, 168, 56, 0.4);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }
        
        .cart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 40px rgba(232, 168, 56, 0.6);
        }
        
        .cart-badge {
            background: var(--bg-primary);
            color: var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }
        
        /* ============================================ */
        /* 🔄 CHARGEMENT */
        /* ============================================ */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        /* ============================================ */
        /* 📱 RESPONSIVE */
        /* ============================================ */
        @media (max-width: 992px) {
            .banner-image, .banner-placeholder { height: 220px; }
            .banner-overlay .restaurant-name-banner { font-size: 1.6rem; }
        }
        
        @media (max-width: 768px) {
            body { padding: 12px; padding-bottom: 100px; }
            
            .banner-image, .banner-placeholder { height: 180px; }
            .banner-overlay { padding: 20px 20px 15px; }
            .banner-overlay .restaurant-name-banner { font-size: 1.3rem; }
            .banner-overlay .restaurant-slogan { font-size: 0.85rem; }
            
            .search-container { padding: 15px; margin-bottom: 20px; }
            .search-bar input { font-size: 14px; padding: 12px 16px; }
            
            .products-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            
            .product-image { height: 140px; }
            .product-body { padding: 14px; }
            .product-name { font-size: 0.95rem; }
            .product-price { font-size: 1rem; }
            
            .cart-modal { max-width: 100%; }
            .cart-button { 
                bottom: 20px; 
                right: 20px; 
                padding: 12px 18px;
                font-size: 0.9rem;
            }
            
            .filter-btn { padding: 8px 14px; font-size: 13px; }
        }
        
        @media (max-width: 480px) {
            .products-grid { grid-template-columns: 1fr; }
            .banner-image, .banner-placeholder { height: 150px; }
            .filter-buttons { justify-content: center; }
            
            .cart-actions { flex-direction: column; }
            .cart-actions button { flex: 1; }
        }
        
        /* ============================================ */
        /* 🔄 ANIMATIONS */
        /* ============================================ */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================ */
        /* 🏷️ SCROLLBAR */
        /* ============================================ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        /* ============================================ */
        /* 🌟 GLOW */
        /* ============================================ */
        .product-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, transparent 40%, var(--accent-glow), transparent 60%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: -1;
        }
        
        .product-card:hover::after {
            opacity: 1;
        }
        
        /* ============================================ */
        /* 📋 STATUS */
        /* ============================================ */
        .status-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .status-message .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }
        
        .status-message h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        /* ============================================ */
        /* 💬 TOAST */
        /* ============================================ */
        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            font-size: 0.95rem;
            z-index: 99999;
            animation: fadeIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <!-- ============================================ -->
    <!-- 🖼️ BANNIÈRE -->
    <!-- ============================================ -->
    <div class="banner-container">
        <img id="bannerImage" class="banner-image" src="" alt="Bannière du restaurant" style="display: none;">
        <div id="bannerPlaceholder" class="banner-placeholder">
            <div class="icon">🍽️</div>
            <span>Bannière du restaurant</span>
        </div>
        <div class="banner-overlay">
            <div class="restaurant-name-banner" id="bannerRestaurantName">Mon Restaurant</div>
            <div class="restaurant-slogan" id="bannerRestaurantSlogan">Découvrez notre carte</div>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 🔍 BARRE DE RECHERCHE -->
    <!-- ============================================ -->
    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher un plat..." oninput="filterProducts()">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all" onclick="filterByCategory('all')">🍽️ Tous</button>
            </div>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 🏪 MENU PRINCIPAL -->
    <!-- ============================================ -->
    <div class="menu-container">
        
        <!-- CHARGEMENT -->
        <div id="loadingIndicator" class="loading">
            <div class="loading-spinner"></div>
            <p class="loading-text">🍽️ Chargement du menu...</p>
        </div>
        
        <!-- CATÉGORIES ET PRODUITS -->
        <div id="menuContent" style="display: none;"></div>
        
        <!-- STATUS SI AUCUN PRODUIT -->
        <div id="emptyState" class="status-message" style="display: none;">
            <span class="icon">🍽️</span>
            <h3>Aucun produit disponible</h3>
            <p>Le menu est en cours de préparation. Revenez bientôt !</p>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 🛒 BOUTON PANIER FLOTTANT -->
    <!-- ============================================ -->
    <button class="cart-button" id="cartButton" onclick="openCart()">
        🛒 Panier
        <span class="cart-badge" id="cartCount">0</span>
    </button>
    
    <!-- ============================================ -->
    <!-- 🛒 MODAL PANIER -->
    <!-- ============================================ -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCartOutside(event)">
        <div class="cart-modal" id="cartModal">
            <!-- En-tête -->
            <div class="cart-header">
                <h2>🛒 Mon panier</h2>
                <button class="close-btn" onclick="closeCart()">✕</button>
            </div>
            
            <!-- Numéro de table -->
            <div class="table-selector">
                <label>🍽️ Table n°</label>
                <input type="number" id="tableNumber" value="1" min="1" max="50">
                <span style="font-size:12px; color:var(--text-muted);">(Saisissez votre numéro de table)</span>
            </div>
            
            <!-- Liste des produits -->
            <div class="cart-items" id="cartItems">
                <div class="cart-empty">
                    <span class="icon">🛒</span>
                    <h3>Votre panier est vide</h3>
                    <p>Ajoutez des plats depuis le menu</p>
                </div>
            </div>
            
            <!-- Footer avec total et actions -->
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total</span>
                    <span class="total-price" id="cartTotal">0.00 €</span>
                </div>
                <div class="cart-actions">
                    <button class="btn-order" id="orderBtn" onclick="placeOrder()">📤 Commander</button>
                    <button class="btn-clear" onclick="clearCart()">🗑️ Vider</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 📜 SCRIPT PRINCIPAL -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // MENU.JS - VERSION AVEC PANIER COMPLET
        // ============================================
        
        // ============================================
        // 1. VARIABLES GLOBALES
        // ============================================
        let allProducts = [];
        let allCategories = {};
        let restaurantData = {};
        let currentCategory = 'all';
        let cart = [];
        let sessionId = '';
        let database, restaurantsRef, categoriesRef, productsRef, ordersRef;
        
        const DEFAULT_RESTAURANT = 'default';
        const STORAGE_KEY = 'menuCart';
        const SESSION_KEY = 'menuSessionId';
        
        // ============================================
        // 2. GESTION DE SESSION (panier unique par appareil)
        // ============================================
        function getSessionId() {
            let id = localStorage.getItem(SESSION_KEY);
            if (!id) {
                id = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem(SESSION_KEY, id);
            }
            return id;
        }
        
        function getCart() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        function saveCart() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
            updateCartBadge();
            renderCart();
        }
        
        // ============================================
        // 3. INITIALISATION FIREBASE
        // ============================================
        function initializeFirebase() {
            if (typeof firebase === 'undefined' || firebase.apps.length === 0) {
                setTimeout(initializeFirebase, 500);
                return;
            }
            
            console.log('✅ Firebase prêt');
            database = firebase.database();
            restaurantsRef = database.ref('restaurants');
            categoriesRef = database.ref('categories');
            productsRef = database.ref('products');
            ordersRef = database.ref('orders/commandes');
            
            sessionId = getSessionId();
            cart = getCart();
            updateCartBadge();
            
            loadRestaurant();
            loadCategories();
            loadProducts();
            
            // Restaurer le numéro de table
            const savedTable = localStorage.getItem('tableNumber');
            if (savedTable) {
                document.getElementById('tableNumber').value = savedTable;
            }
        }
        
        // ============================================
        // 4. CHARGEMENT DU RESTAURANT
        // ============================================
        function loadRestaurant() {
            restaurantsRef.child(DEFAULT_RESTAURANT).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    restaurantData = data;
                    displayBanner(data);
                }
            });
        }
        
        function displayBanner(data) {
            const bannerImg = document.getElementById('bannerImage');
            const bannerPlaceholder = document.getElementById('bannerPlaceholder');
            const bannerName = document.getElementById('bannerRestaurantName');
            const bannerSlogan = document.getElementById('bannerRestaurantSlogan');
            
            if (bannerName) bannerName.textContent = data.name || 'Mon Restaurant';
            
            if (bannerSlogan) {
                const address = data.address || '';
                bannerSlogan.textContent = address || 'Découvrez notre carte';
            }
            
            if (bannerImg && data.banner) {
                bannerImg.src = data.banner;
                bannerImg.style.display = 'block';
                bannerPlaceholder.style.display = 'none';
                bannerImg.onerror = function() {
                    this.style.display = 'none';
                    bannerPlaceholder.style.display = 'flex';
                };
            } else if (bannerImg) {
                bannerImg.style.display = 'none';
                bannerPlaceholder.style.display = 'flex';
            }
        }
        
        // ============================================
        // 5. CHARGEMENT DES CATÉGORIES
        // ============================================
        function loadCategories() {
            categoriesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                allCategories = data || {};
                updateFilterButtons();
            });
        }
        
        function updateFilterButtons() {
            const container = document.getElementById('filterButtons');
            if (!container) return;
            
            const allBtn = container.querySelector('[data-category="all"]');
            container.innerHTML = '';
            container.appendChild(allBtn);
            
            const sortedKeys = Object.keys(allCategories)
                .filter(key => allCategories[key].active !== false)
                .sort((a, b) => (allCategories[a].order || 0) - (allCategories[b].order || 0));
            
            sortedKeys.forEach(key => {
                const cat = allCategories[key];
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = key;
                btn.textContent = `${cat.icon || '📁'} ${cat.name}`;
                btn.onclick = () => filterByCategory(key);
                container.appendChild(btn);
            });
        }
        
        // ============================================
        // 6. CHARGEMENT DES PRODUITS
        // ============================================
        function loadProducts() {
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allProducts = Object.keys(data)
                        .map(key => ({ id: key, ...data[key] }))
                        .filter(p => p.visible !== false);
                } else {
                    allProducts = [];
                }
                renderMenu();
            });
        }
        
        // ============================================
        // 7. AFFICHAGE DU MENU
        // ============================================
        function renderMenu() {
            const container = document.getElementById('menuContent');
            const loading = document.getElementById('loadingIndicator');
            const empty = document.getElementById('emptyState');
            
            if (!container) return;
            if (loading) loading.style.display = 'none';
            
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const filtered = allProducts.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm) || 
                                   (p.description && p.description.toLowerCase().includes(searchTerm));
                return matchCategory && matchSearch;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                if (empty) empty.style.display = 'block';
                container.style.display = 'none';
                return;
            }
            if (empty) empty.style.display = 'none';
            container.style.display = 'block';
            
            const grouped = {};
            filtered.forEach(p => {
                const catKey = p.category || 'autres';
                if (!grouped[catKey]) grouped[catKey] = [];
                grouped[catKey].push(p);
            });
            
            const sortedCategories = Object.keys(grouped)
                .sort((a, b) => (allCategories[a]?.order || 999) - (allCategories[b]?.order || 999));
            
            let html = '';
            sortedCategories.forEach(catKey => {
                const cat = allCategories[catKey] || { name: catKey, icon: '📁' };
                const products = grouped[catKey];
                
                html += `
                    <div class="category-section fade-in">
                        <div class="category-header">
                            <span class="category-icon">${cat.icon || '📁'}</span>
                            <h2 class="category-title">${cat.name}</h2>
                            <span class="category-count">${products.length}</span>
                        </div>
                        <div class="products-grid">
                `;
                
                products.forEach(p => {
                    const price = parseFloat(p.price) || 0;
                    html += `
                        <div class="product-card fade-in" onclick="addToCart('${p.id}')">
                            ${p.image ? `<img src="${p.image}" class="product-image" alt="${p.name}" onerror="this.style.display='none'">` : 
                                `<div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-muted);background:var(--bg-secondary);">🍽️</div>`}
                            <div class="product-body">
                                <div class="product-header">
                                    <span class="product-name">${p.name}</span>
                                    <span class="product-price">${price.toFixed(2)} €</span>
                                </div>
                                ${p.description ? `<p class="product-description">${p.description}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================
        // 8. FILTRES ET RECHERCHE
        // ============================================
        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            renderMenu();
        }
        
        function filterProducts() {
            renderMenu();
        }
        
        // ============================================
        // 9. GESTION DU PANIER
        // ============================================
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: parseFloat(product.price) || 0,
                    quantity: 1,
                    image: product.image || null
                });
            }
            
            saveCart();
            showToast(`✅ ${product.name} ajouté au panier`);
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            renderCart();
            showToast('🗑️ Produit retiré du panier');
        }
        
        function updateQuantity(productId, delta) {
            const item = cart.find(p => p.id === productId);
            if (!item) return;
            
            item.quantity += delta;
            if (item.quantity <= 0) {
                removeFromCart(productId);
                return;
            }
            saveCart();
            renderCart();
        }
        
        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('🗑️ Vider tout le panier ?')) {
                cart = [];
                saveCart();
                renderCart();
                showToast('🗑️ Panier vidé');
            }
        }
        
        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            if (badge) {
                const total = cart.reduce((sum, item) => sum + item.quantity, 0);
                badge.textContent = total;
            }
        }
        
        // ============================================
        // 10. AFFICHAGE DU PANIER (MODAL)
        // ============================================
        function openCart() {
            const overlay = document.getElementById('cartOverlay');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderCart();
        }
        
        function closeCart() {
            const overlay = document.getElementById('cartOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function closeCartOutside(event) {
            if (event.target === event.currentTarget) {
                closeCart();
            }
        }
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const orderBtn = document.getElementById('orderBtn');
            
            if (!container) return;
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <span class="icon">🛒</span>
                        <h3>Votre panier est vide</h3>
                        <p>Ajoutez des plats depuis le menu</p>
                    </div>
                `;
                if (totalEl) totalEl.textContent = '0.00 €';
                if (orderBtn) orderBtn.disabled = true;
                return;
            }
            
            if (orderBtn) orderBtn.disabled = false;
            
            let html = '';
            let total = 0;
            
            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                
                html += `
                    <div class="cart-item fade-in" style="animation-delay: ${index * 0.05}s">
                        ${item.image ? 
                            `<img src="${item.image}" class="cart-item-image" onerror="this.style.display='none'">` : 
                            `<div class="cart-item-image-placeholder">🍽️</div>`}
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${(item.price * item.quantity).toFixed(2)} €</div>
                            <div class="cart-item-quantity">
                                <button onclick="updateQuantity('${item.id}', -1)">−</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity('${item.id}', 1)">+</button>
                            </div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart('${item.id}')" title="Supprimer">✕</button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            if (totalEl) totalEl.textContent = total.toFixed(2) + ' €';
        }
        
        // ============================================
        // 11. COMMANDE
        // ============================================
        function placeOrder() {
            if (cart.length === 0) {
                showToast('❌ Votre panier est vide');
                return;
            }
            
            const tableNumber = parseInt(document.getElementById('tableNumber').value) || 1;
            if (tableNumber < 1 || tableNumber > 50) {
                showToast('❌ Numéro de table invalide (1-50)');
                return;
            }
            
            // Sauvegarder le numéro de table
            localStorage.setItem('tableNumber', tableNumber);
            
            const orderData = {
                table: tableNumber,
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    subtotal: item.price * item.quantity,
                    image: item.image || null
                })),
                total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                timestamp: Date.now(),
                status: 'en_attente',
                orderNumber: 'CMD-' + Date.now().toString().slice(-6),
                sessionId: sessionId,
                restaurant: DEFAULT_RESTAURANT,
                restaurantName: restaurantData.name || 'Mon Restaurant'
            };
            
            // Envoyer à Firebase
            const newOrderRef = ordersRef.push();
            newOrderRef.set(orderData)
                .then(() => {
                    console.log('✅ Commande enregistrée dans Firebase');
                    
                    // Envoyer sur WhatsApp
                    sendWhatsAppOrder(orderData);
                    
                    // Vider le panier
                    cart = [];
                    saveCart();
                    renderCart();
                    closeCart();
                    showToast('✅ Commande envoyée !');
                })
                .catch(error => {
                    console.error('❌ Erreur commande:', error);
                    showToast('❌ Erreur: ' + error.message);
                });
        }
        
        function sendWhatsAppOrder(orderData) {
            const phone = restaurantData.whatsapp || '';
            if (!phone) {
                console.warn('⚠️ Numéro WhatsApp non configuré');
                return;
            }
            
            // Construire le message
            let message = `🍽️ *Nouvelle commande*\n`;
            message += `📋 Table n°${orderData.table}\n`;
            message += `🆔 ${orderData.orderNumber}\n`;
            message += `━━━━━━━━━━━━━━━━━\n\n`;
            
            orderData.items.forEach((item, i) => {
                message += `${i+1}. ${item.name} x${item.quantity} = ${item.subtotal.toFixed(2)}€\n`;
            });
            
            message += `\n━━━━━━━━━━━━━━━━━\n`;
            message += `💰 *Total : ${orderData.total.toFixed(2)} €*\n`;
            message += `━━━━━━━━━━━━━━━━━\n`;
            message += `📱 Commande depuis le menu en ligne`;
            
            const encodedMessage = encodeURIComponent(message);
            const url = `https://wa.me/${phone}?text=${encodedMessage}`;
            
            // Ouvrir WhatsApp dans un nouvel onglet
            window.open(url, '_blank');
        }
        
        // ============================================
        // 12. TOAST
        // ============================================
        function showToast(message) {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
        
        // ============================================
        // 13. INITIALISATION
        // ============================================
        if (document.readyState === 'complete') {
            initializeFirebase();
        } else {
            window.addEventListener('load', initializeFirebase);
        }
        
        // Exposer les fonctions globalement
        window.filterByCategory = filterByCategory;
        window.filterProducts = filterProducts;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.updateQuantity = updateQuantity;
        window.clearCart = clearCart;
        window.openCart = openCart;
        window.closeCart = closeCart;
        window.closeCartOutside = closeCartOutside;
        window.placeOrder = placeOrder;
        window.renderCart = renderCart;
        
        console.log('✅ Menu chargé - Panier complet avec commande WhatsApp');
        console.log('📱 Session ID:', sessionId);
    </script>
</body>
</html>
