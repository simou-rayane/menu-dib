<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Firebase</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        /* ... tous vos styles existants ... */
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- TOUT VOTRE HTML EXISTANT (header, login, tabs, etc.) -->
    <!-- ============================================ -->
    
    <div class="container">
        <!-- ... tout votre HTML ... -->
    </div>
    
    <!-- ============================================ -->
    <!-- FIREBASE CONFIG -->
    <!-- ============================================ -->
    <script src="config.js" onerror="handleConfigError()"></script>
   
    <!-- ============================================ -->
    <!-- SCRIPT PRINCIPAL CORRIGÉ -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // ADMIN.JS - VERSION COMPLÈTEMENT CORRIGÉE
        // ============================================
        
        // ============================================
        // 1. VARIABLES GLOBALES
        // ============================================
        let products = [];
        let categories = {};
        let restaurantData = {};
        let picxImages = [];
        let selectedPicxImage = null;
        let imageSelectorMode = null;
        let currentRestaurantId = 'default';
        let pendingProductId = null;
        let picxMode = 'add';
        
        // Références Firebase (seront initialisées dans initializeFirebase)
        let database, restaurantsRef, categoriesRef, productsRef;
        
        // ============================================
        // 2. CONFIGURATION PICX
        // ============================================
        const PICX_CONFIG = {
            username: 'simou-rayane',
            repo: 'picx-images-hosting',
            branch: 'master'
        };
        
        // ============================================
        // 3. GESTIONNAIRE D'ERREUR CONFIG
        // ============================================
        function handleConfigError() {
            console.error('❌ Erreur: config.js non trouvé');
            document.getElementById('connectionStatus').innerHTML = '❌ Erreur: config.js manquant';
            document.getElementById('connectionStatus').className = 'disconnected';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loginError').textContent = '⚠️ Le fichier config.js est manquant. Contactez l\'administrateur.';
        }
        
        // ============================================
        // 4. TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const colors = { 'success': '#4caf50', 'error': '#dc3545', 'warning': '#ff9800', 'info': '#2196F3' };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.style.background = colors[type] || '#667eea';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.5s ease reverse';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
        
        // ============================================
        // 5. RECHARGEMENT DES DONNÉES (défini AVANT utilisation)
        // ============================================
        function reloadAllData() {
            console.log('🔄 Rechargement des données...');
            showToast('🔄 Rechargement...', 'info');
            
            if (typeof loadRestaurant === 'function') loadRestaurant();
            if (typeof loadCategories === 'function') loadCategories();
            if (typeof loadProducts === 'function') loadProducts();
            
            setTimeout(() => {
                console.log('📊 État des données:');
                console.log('  - Restaurant:', restaurantData ? '✅' : '❌');
                console.log('  - Catégories:', Object.keys(categories).length > 0 ? '✅ (' + Object.keys(categories).length + ')' : '❌');
                console.log('  - Produits:', products.length > 0 ? '✅ (' + products.length + ')' : '❌');
                showToast('✅ Données rechargées', 'success');
            }, 1000);
        }
        
        // ============================================
        // 6. AUTHENTIFICATION
        // ============================================
        function loginUser(email, password) {
            return firebase.auth().signInWithEmailAndPassword(email, password);
        }
        
        function logoutUser() {
            firebase.auth().signOut()
                .then(() => {
                    console.log('👋 Déconnecté');
                    showToast('👋 Déconnecté', 'info');
                    showLoginForm();
                })
                .catch(error => {
                    console.error('❌ Erreur déconnexion:', error);
                    showToast('❌ Erreur: ' + error.message, 'error');
                });
        }
        
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('connectionStatus').innerHTML = '🔐 Veuillez vous connecter';
            document.getElementById('connectionStatus').className = 'disconnected';
        }
        
        function showAdminContent() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }
        
        function addLogoutButton() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.style.display = 'inline-block';
                logoutBtn.onclick = logoutUser;
            }
        }
        
        // ============================================
        // 7. INITIALISATION FIREBASE (UNIQUE DÉCLARATION)
        // ============================================
        function initializeFirebase() {
            if (typeof firebase === 'undefined' || firebase.apps.length === 0) {
                console.log('⏳ Attente de Firebase...');
                setTimeout(initializeFirebase, 500);
                return;
            }
            
            console.log('✅ Firebase prêt');
            
            // ✅ UNIQUE DÉCLARATION DES RÉFÉRENCES
            database = firebase.database();
            restaurantsRef = database.ref('restaurants');
            categoriesRef = database.ref('categories');
            productsRef = database.ref('products');
            
            // Exposer globalement
            window.database = database;
            window.restaurantsRef = restaurantsRef;
            window.categoriesRef = categoriesRef;
            window.productsRef = productsRef;
            
            console.log('✅ Références Firebase initialisées');
        }
        
        // ============================================
        // 8. AUTH STATE AVEC VÉRIFICATION UID
        // ============================================
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                console.log('✅ Utilisateur connecté:', user.email);
                console.log('🆔 Votre UID:', user.uid);
                
                // 🔐 VÉRIFICATION DE L'UID
                const expectedUID = 'kW1jJa76EuVPg53pwBuk58nCs1e2';
                
                if (user.uid === expectedUID) {
                    console.log('✅ UID correspond aux règles Firebase');
                    document.getElementById('connectionStatus').innerHTML = `✅ Connecté en tant que ${user.email} (UID OK)`;
                    document.getElementById('connectionStatus').className = 'connected';
                } else {
                    console.warn('⚠️ ATTENTION: UID ne correspond pas aux règles!');
                    console.warn(`📌 Règles attendent: ${expectedUID}`);
                    console.warn(`📌 Votre UID: ${user.uid}`);
                    document.getElementById('connectionStatus').innerHTML = `⚠️ UID non conforme - Votre UID: ${user.uid}`;
                    document.getElementById('connectionStatus').className = 'disconnected';
                }
                
                showAdminContent();
                addLogoutButton();
                
                // 🔥 Charger les données après connexion
                setTimeout(() => {
                    console.log('🔄 Chargement des données...');
                    if (typeof loadRestaurant === 'function') loadRestaurant();
                    if (typeof loadCategories === 'function') loadCategories();
                    if (typeof loadProducts === 'function') loadProducts();
                }, 500);
                
            } else {
                console.log('🔐 Non connecté');
                showLoginForm();
            }
        });
        
        // ============================================
        // 9. FORMULAIRE DE CONNEXION
        // ============================================
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const btn = this.querySelector('.btn-login');
            btn.disabled = true;
            btn.textContent = '⏳ Connexion...';
            document.getElementById('loginError').textContent = '';
            
            loginUser(email, password)
                .then((userCredential) => {
                    console.log('✅ Connexion réussie:', userCredential.user.email);
                    this.reset();
                    showToast('✅ Bienvenue ' + userCredential.user.email, 'success');
                })
                .catch((error) => {
                    console.error('❌ Erreur connexion:', error);
                    let errorMessage = '❌ ' + error.message;
                    if (error.code === 'auth/user-not-found') {
                        errorMessage = '❌ Utilisateur non trouvé. Vérifiez votre email.';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMessage = '❌ Mot de passe incorrect.';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = '❌ Email invalide.';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = '❌ Trop de tentatives. Réessayez plus tard.';
                    }
                    document.getElementById('loginError').textContent = errorMessage;
                    showToast(errorMessage, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '🔐 Se connecter';
                });
        });
        
        // ============================================
        // 10. CHARGEMENT DU RESTAURANT
        // ============================================
        function loadRestaurant() {
            if (!restaurantsRef) {
                console.warn('⏳ RestaurantsRef non initialisé');
                return;
            }
            
            restaurantsRef.child(currentRestaurantId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    restaurantData = data;
                    populateRestaurantForm(data);
                    updateLogoPreview(data.logo);
                    updateBannerPreview(data.banner);
                    console.log('✅ Restaurant chargé:', data.name);
                } else {
                    console.log('📝 Aucune donnée restaurant, création par défaut');
                    restaurantData = getDefaultRestaurant();
                    populateRestaurantForm(restaurantData);
                    updateLogoPreview(null);
                    updateBannerPreview(null);
                    restaurantsRef.child(currentRestaurantId).set(restaurantData);
                }
            }, (error) => {
                console.error('❌ Erreur chargement restaurant:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
            });
        }
        
        function getDefaultRestaurant() {
            return {
                name: "Mon Restaurant",
                logo: null,
                banner: null,
                address: "123 Rue de la Paix, 75001 Paris",
                phone: "01 23 45 67 89",
                phoneLink: "+33123456789",
                whatsapp: "33123456789",
                deliveryPrice: 5,
                deliveryAvailable: true,
                facebook: null,
                instagram: null,
                website: null,
                mapsUrl: null,
                active: true
            };
        }
        
        function populateRestaurantForm(data) {
            if (!data) return;
            document.getElementById('restaurantId').value = currentRestaurantId;
            document.getElementById('restaurantName').value = data.name || '';
            document.getElementById('restaurantLogo').value = data.logo || '';
            document.getElementById('restaurantBanner').value = data.banner || '';
            document.getElementById('restaurantAddress').value = data.address || '';
            document.getElementById('restaurantPhone').value = data.phone || '';
            document.getElementById('restaurantPhoneLink').value = data.phoneLink || '';
            document.getElementById('restaurantWhatsApp').value = data.whatsapp || '';
            document.getElementById('restaurantDeliveryPrice').value = data.deliveryPrice || 0;
            document.getElementById('restaurantDeliveryAvailable').value = data.deliveryAvailable !== false ? 'true' : 'false';
            document.getElementById('restaurantFacebook').value = data.facebook || '';
            document.getElementById('restaurantInstagram').value = data.instagram || '';
            document.getElementById('restaurantWebsite').value = data.website || '';
            document.getElementById('restaurantMapsUrl').value = data.mapsUrl || '';
            document.getElementById('restaurantActive').value = data.active !== false ? 'true' : 'false';
        }
        
        function resetRestaurantForm() {
            if (confirm('🔄 Réinitialiser le formulaire avec les valeurs actuelles ?')) {
                populateRestaurantForm(restaurantData);
                updateLogoPreview(restaurantData.logo);
                updateBannerPreview(restaurantData.banner);
                showToast('🔄 Formulaire réinitialisé', 'info');
            }
        }
        
        // ============ LOGO ET BANNIÈRE ============
        function updateLogoPreview(logoUrl) {
            const img = document.getElementById('logoPreviewImg');
            const placeholder = document.getElementById('logoPlaceholder');
            const name = document.getElementById('logoName');
            const url = document.getElementById('logoUrl');
            const hiddenInput = document.getElementById('restaurantLogo');
            
            if (logoUrl && logoUrl.trim()) {
                img.src = logoUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                name.textContent = 'Logo actuel';
                url.textContent = logoUrl;
                hiddenInput.value = logoUrl;
                img.onerror = function() {
                    this.style.display = 'none';
                    placeholder.style.display = 'flex';
                    name.textContent = 'Image invalide';
                    url.textContent = 'L\'URL du logo est invalide';
                };
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
                const restaurantName = document.getElementById('restaurantName').value || 'R';
                placeholder.textContent = restaurantName.charAt(0).toUpperCase();
                name.textContent = 'Aucun logo';
                url.textContent = '-';
                hiddenInput.value = '';
            }
        }
        
        function updateBannerPreview(bannerUrl) {
            const img = document.getElementById('bannerPreviewImg');
            const placeholder = document.getElementById('bannerPlaceholder');
            const name = document.getElementById('bannerName');
            const url = document.getElementById('bannerUrl');
            const hiddenInput = document.getElementById('restaurantBanner');
            
            if (bannerUrl && bannerUrl.trim()) {
                img.src = bannerUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                name.textContent = 'Bannière actuelle';
                url.textContent = bannerUrl;
                hiddenInput.value = bannerUrl;
                img.onerror = function() {
                    this.style.display = 'none';
                    placeholder.style.display = 'flex';
                    name.textContent = 'Image invalide';
                    url.textContent = 'L\'URL de la bannière est invalide';
                };
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
                name.textContent = 'Aucune bannière';
                url.textContent = '-';
                hiddenInput.value = '';
            }
        }
        
        function openImageSelector(mode) {
            imageSelectorMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-tab="tab-images"]').classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-images').classList.add('active');
            
            const label = mode === 'logo' ? 'logo' : 'bannière';
            showToast(`📷 Sélectionnez une image pour la ${label}`, 'info');
            
            if (picxImages.length === 0) {
                loadPicXImagesForGallery();
            }
        }
        
        function removeImage(type) {
            if (type === 'logo') {
                if (confirm('🗑️ Supprimer le logo actuel ?')) {
                    updateLogoPreview(null);
                    document.getElementById('restaurantLogo').value = '';
                    showToast('🗑️ Logo supprimé', 'info');
                }
            } else if (type === 'banner') {
                if (confirm('🗑️ Supprimer la bannière actuelle ?')) {
                    updateBannerPreview(null);
                    document.getElementById('restaurantBanner').value = '';
                    showToast('🗑️ Bannière supprimée', 'info');
                }
            }
        }
        
        // ============ SAUVEGARDER LE RESTAURANT ============
        document.getElementById('restaurantForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('restaurantName').value.trim(),
                logo: document.getElementById('restaurantLogo').value.trim() || null,
                banner: document.getElementById('restaurantBanner').value.trim() || null,
                address: document.getElementById('restaurantAddress').value.trim() || null,
                phone: document.getElementById('restaurantPhone').value.trim() || null,
                phoneLink: document.getElementById('restaurantPhoneLink').value.trim() || null,
                whatsapp: document.getElementById('restaurantWhatsApp').value.trim() || null,
                deliveryPrice: parseFloat(document.getElementById('restaurantDeliveryPrice').value) || 0,
                deliveryAvailable: document.getElementById('restaurantDeliveryAvailable').value === 'true',
                facebook: document.getElementById('restaurantFacebook').value.trim() || null,
                instagram: document.getElementById('restaurantInstagram').value.trim() || null,
                website: document.getElementById('restaurantWebsite').value.trim() || null,
                mapsUrl: document.getElementById('restaurantMapsUrl').value.trim() || null,
                active: document.getElementById('restaurantActive').value === 'true'
            };
            
            if (!data.name) {
                showToast('❌ Le nom du restaurant est requis', 'error');
                return;
            }
            
            const btn = this.querySelector('.btn-save');
            btn.disabled = true;
            btn.textContent = '⏳ Sauvegarde...';
            
            restaurantsRef.child(currentRestaurantId).update(data)
                .then(() => {
                    showToast('✅ Restaurant mis à jour avec succès !', 'success');
                    restaurantData = data;
                })
                .catch(error => {
                    showToast('❌ Erreur: ' + error.message, 'error');
                    console.error('❌ Erreur sauvegarde:', error);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = '💾 Enregistrer';
                });
        });
        
        // ============================================
        // 11. GESTION DES CATÉGORIES
        // ============================================
        function loadCategories() {
            if (!categoriesRef) {
                console.warn('⏳ CategoriesRef non initialisé');
                return;
            }
            
            categoriesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    categories = data;
                    console.log('✅ Catégories chargées:', Object.keys(categories).length);
                } else {
                    categories = {};
                    console.log('📝 Aucune catégorie, création par défaut');
                    createDefaultCategories();
                }
                displayCategories();
                updateCategorySelect();
                document.getElementById('categoryCount').textContent = Object.keys(categories).length;
            }, (error) => {
                console.error('❌ Erreur chargement catégories:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
            });
        }
        
        function createDefaultCategories() {
            const defaultCategories = {
                'entrees': { name: 'Entrées', icon: '🥗', order: 1, active: true },
                'plats': { name: 'Plats', icon: '🍽️', order: 2, active: true },
                'desserts': { name: 'Desserts', icon: '🍰', order: 3, active: true },
                'boissons': { name: 'Boissons', icon: '🥤', order: 4, active: true }
            };
            categoriesRef.set(defaultCategories);
        }
        
        function displayCategories() {
            const container = document.getElementById('categoriesList');
            if (!container) return;
            
            const sortedKeys = Object.keys(categories).sort((a, b) => 
                (categories[a].order || 0) - (categories[b].order || 0)
            );
            
            if (sortedKeys.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; grid-column: 1/-1;">Aucune catégorie</p>';
                return;
            }
            
            container.innerHTML = '';
            sortedKeys.forEach(key => {
                const cat = categories[key];
                const div = document.createElement('div');
                div.className = 'category-item';
                div.innerHTML = `
                    <span class="category-icon">${cat.icon || '📁'}</span>
                    <span class="category-name">${cat.name}</span>
                    <span class="category-key">${key}</span>
                    <span class="category-status ${cat.active !== false ? 'active' : 'inactive'}">
                        ${cat.active !== false ? '✅ Actif' : '⛔ Inactif'}
                    </span>
                    <div class="category-actions">
                        <button class="btn-edit-cat" onclick="editCategory('${key}')">✏️</button>
                        <button class="btn-toggle-cat" onclick="toggleCategory('${key}')">
                            ${cat.active !== false ? '⛔' : '✅'}
                        </button>
                        <button class="btn-delete-cat" onclick="deleteCategory('${key}')">🗑</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function addCategory() {
            const key = document.getElementById('newCategoryKey').value.trim();
            const name = document.getElementById('newCategoryName').value.trim();
            const icon = document.getElementById('newCategoryIcon').value.trim() || '📁';
            
            if (!key || !name) {
                showToast('❌ Veuillez entrer une clé et un nom', 'error');
                return;
            }
            if (!/^[a-z0-9_]+$/.test(key)) {
                showToast('❌ Clé invalide (uniquement lettres minuscules, chiffres, _)', 'error');
                return;
            }
            if (categories[key]) {
                showToast('❌ Cette catégorie existe déjà', 'error');
                return;
            }
            
            categoriesRef.child(key).set({ 
                name, 
                icon, 
                order: Object.keys(categories).length + 1, 
                active: true 
            })
            .then(() => {
                showToast(`✅ Catégorie "${name}" ajoutée !`, 'success');
                document.getElementById('newCategoryKey').value = '';
                document.getElementById('newCategoryName').value = '';
                document.getElementById('newCategoryIcon').value = '';
            })
            .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
        }
        
        function editCategory(key) {
            const cat = categories[key];
            if (!cat) return;
            
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <h2>✏️ Modifier la catégorie</h2>
                    <form id="editCategoryForm">
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Nom</label>
                            <input type="text" id="editCatName" value="${cat.name}" required>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Icône</label>
                            <input type="text" id="editCatIcon" value="${cat.icon || '📁'}">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 600;">Ordre</label>
                            <input type="number" id="editCatOrder" value="${cat.order || 0}">
                        </div>
                        <div class="modal-actions">
                            <button type="submit" class="btn-save">✅ Sauvegarder</button>
                            <button type="button" class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">❌ Annuler</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('editCategoryForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const updates = {
                    name: document.getElementById('editCatName').value.trim(),
                    icon: document.getElementById('editCatIcon').value.trim() || '📁',
                    order: parseInt(document.getElementById('editCatOrder').value) || 0
                };
                categoriesRef.child(key).update(updates)
                    .then(() => { 
                        showToast('✅ Catégorie modifiée !', 'success'); 
                        overlay.remove(); 
                    })
                    .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
            });
        }
        
        function toggleCategory(key) {
            const cat = categories[key];
            if (!cat) return;
            const newStatus = cat.active === false ? true : false;
            categoriesRef.child(key).update({ active: newStatus })
                .then(() => showToast(`✅ Catégorie ${newStatus ? 'activée' : 'désactivée'}`, 'success'))
                .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
        }
        
        function deleteCategory(key) {
            const cat = categories[key];
            if (!cat) return;
            const productsInCategory = products.filter(p => p.category === key);
            if (productsInCategory.length > 0) {
                showToast(`❌ ${productsInCategory.length} produit(s) utilisent cette catégorie`, 'error');
                return;
            }
            if (confirm(`Supprimer "${cat.name}" ?`)) {
                categoriesRef.child(key).remove()
                    .then(() => showToast('✅ Catégorie supprimée !', 'success'))
                    .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
            }
        }
        
        function updateCategorySelect() {
            const select = document.getElementById('productCategory');
            if (!select) return;
            select.innerHTML = '<option value="">Choisir une catégorie...</option>';
            const sortedKeys = Object.keys(categories).sort((a, b) => (categories[a].order || 0) - (categories[b].order || 0));
            sortedKeys.forEach(key => {
                const cat = categories[key];
                if (cat.active !== false) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `${cat.icon || '📁'} ${cat.name}`;
                    select.appendChild(option);
                }
            });
        }
        
        // ============================================
        // 12. GESTION DES PRODUITS
        // ============================================
        function loadProducts() {
            if (!productsRef) {
                console.warn('⏳ ProductsRef non initialisé');
                return;
            }
            
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    products = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    console.log('✅ Produits chargés:', products.length);
                } else {
                    products = [];
                    console.log('📝 Aucun produit');
                }
                displayProducts();
                document.getElementById('productCount').textContent = products.length;
            }, (error) => {
                console.error('❌ Erreur chargement produits:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
            });
        }
        
        function displayProducts() {
            const container = document.getElementById('productsList');
            if (!container) return;
            
            if (products.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">Aucun produit</p>';
                return;
            }
            
            container.innerHTML = '';
            products.forEach((product) => {
                const div = document.createElement('div');
                div.className = 'product-item';
                const categoryName = categories[product.category]?.name || product.category || 'Non catégorisé';
                const categoryIcon = categories[product.category]?.icon || '';
                
                let imageHtml = product.image 
                    ? `<img src="${product.image}" class="product-thumbnail" onerror="this.style.display='none'; this.parentElement.querySelector('.product-thumbnail-placeholder').style.display='flex';">` 
                    : `<div class="product-thumbnail-placeholder">📷</div>`;
                
                div.innerHTML = `
                    <div class="product-info">
                        ${imageHtml}
                        <div class="product-details">
                            <div>
                                <span class="name">${product.name}</span>
                                <span class="price">${parseFloat(product.price).toFixed(2)} €</span>
                                <span class="category">(${categoryIcon} ${categoryName})</span>
                            </div>
                            <div class="description">${product.description || ''}</div>
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="${product.visible !== false ? 'status-visible' : 'status-hidden'}" onclick="toggleVisibility('${product.id}')">
                            ${product.visible !== false ? '✓ Visible' : '✗ Masqué'}
                        </button>
                        <button class="btn-edit" onclick="editProduct('${product.id}')">✏️</button>
                        <button class="btn-photo" onclick="changeImage('${product.id}')">📷</button>
                        <button class="btn-delete" onclick="deleteProduct('${product.id}')">🗑</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function validateProduct(p) {
            if (!p.name?.trim()) { 
                showToast('❌ Le nom est requis', 'error'); 
                return false; 
            }
            if (!p.price || isNaN(p.price) || p.price <= 0) { 
                showToast('❌ Prix invalide', 'error'); 
                return false; 
            }
            if (!p.category) { 
                showToast('❌ La catégorie est requise', 'error'); 
                return false; 
            }
            return true;
        }
        
        function addProduct(productData) {
            return new Promise((resolve, reject) => {
                if (!validateProduct(productData)) { 
                    reject(new Error('Validation')); 
                    return; 
                }
                
                const newProduct = {
                    name: productData.name.trim(),
                    price: parseFloat(productData.price),
                    category: productData.category,
                    description: productData.description?.trim() || '',
                    visible: true,
                    image: document.getElementById('productImage').value.trim() || null,
                    createdAt: Date.now()
                };
                
                productsRef.push().set(newProduct)
                    .then(() => {
                        showToast('✅ Produit ajouté !', 'success');
                        document.getElementById('productForm').reset();
                        clearPicXImage();
                        resolve(true);
                    })
                    .catch(error => { 
                        showToast('❌ Erreur: ' + error.message, 'error'); 
                        reject(error); 
                    });
            });
        }
        
        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            let catOptions = '';
            const sortedKeys = Object.keys(categories).sort((a, b) => (categories[a].order || 0) - (categories[b].order || 0));
            sortedKeys.forEach(key => {
                const cat = categories[key];
                if (cat.active !== false) {
                    catOptions += `<option value="${key}" ${key === product.category ? 'selected' : ''}>${cat.icon || '📁'} ${cat.name}</option>`;
                }
            });
            
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <h2>✏️ Modifier le produit</h2>
                    <form id="editForm">
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:600;">Nom</label>
                            <input type="text" id="editName" value="${product.name}" required>
                        </div>
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:600;">Prix (€)</label>
                            <input type="number" id="editPrice" value="${product.price}" step="0.01" required>
                        </div>
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:600;">Catégorie</label>
                            <select id="editCategory">${catOptions}</select>
                        </div>
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:600;">Description</label>
                            <textarea id="editDesc" rows="3">${product.description || ''}</textarea>
                        </div>
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:600;">Image URL</label>
                            <input type="text" id="editImageUrl" value="${product.image || ''}" placeholder="https://...">
                        </div>
                        <div class="modal-actions">
                            <button type="submit" class="btn-save">✅ Sauvegarder</button>
                            <button type="button" class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">❌ Annuler</button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('editForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const updates = {
                    name: document.getElementById('editName').value.trim(),
                    price: parseFloat(document.getElementById('editPrice').value),
                    category: document.getElementById('editCategory').value,
                    description: document.getElementById('editDesc').value.trim(),
                    image: document.getElementById('editImageUrl').value.trim() || null,
                    updatedAt: Date.now()
                };
                if (!validateProduct(updates)) return;
                
                productsRef.child(productId).update(updates)
                    .then(() => { 
                        showToast('✅ Produit modifié !', 'success'); 
                        overlay.remove(); 
                    })
                    .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
            });
        }
        
        function deleteProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (confirm(`Supprimer "${product.name}" ?`)) {
                productsRef.child(productId).remove()
                    .then(() => showToast('✅ Produit supprimé !', 'success'))
                    .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
            }
        }
        
        function toggleVisibility(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            productsRef.child(productId).update({ 
                visible: product.visible === false ? true : false, 
                updatedAt: Date.now() 
            })
            .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
        }
        
        // ============ FORMULAIRE D'AJOUT PRODUIT ============
        document.getElementById('addBtn').addEventListener('click', function() {
            const productData = {
                name: document.getElementById('productName').value,
                price: document.getElementById('productPrice').value,
                category: document.getElementById('productCategory').value,
                description: document.getElementById('productDesc').value
            };
            
            this.disabled = true;
            this.textContent = '⏳ Ajout en cours...';
            
            addProduct(productData)
                .then(() => {
                    document.getElementById('productForm').reset();
                    clearPicXImage();
                })
                .catch(() => {})
                .finally(() => {
                    this.disabled = false;
                    this.textContent = '➕ Ajouter le produit';
                });
        });
        
        // ============================================
        // 13. PICX - GESTION DES IMAGES
        // ============================================
        async function loadPicXImages() {
            try {
                const username = document.getElementById('githubUsername').value.trim() || PICX_CONFIG.username;
                const repo = document.getElementById('githubRepo').value.trim() || PICX_CONFIG.repo;
                const branch = document.getElementById('githubBranch').value.trim() || PICX_CONFIG.branch;
                
                const url = `https://api.github.com/repos/${username}/${repo}/contents?ref=${branch}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Erreur de chargement des images');
                }
                
                const data = await response.json();
                
                const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'];
                picxImages = data.filter(item => 
                    item.type === 'file' && 
                    imageExtensions.some(ext => item.name.toLowerCase().endsWith(ext))
                );
                
                if (picxImages.length === 0) {
                    showToast('❌ Aucune image trouvée', 'error');
                    return [];
                }
                
                return picxImages;
                
            } catch (error) {
                console.error('Erreur chargement PicX:', error);
                showToast('❌ Erreur: ' + error.message, 'error');
                return [];
            }
        }
        
        async function loadPicXImagesForGallery() {
            const images = await loadPicXImages();
            const grid = document.getElementById('picxGalleryGrid');
            
            if (!images || images.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 30px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📂</div>
                        <p>Aucune image trouvée</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = '';
            images.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'picx-item';
                div.innerHTML = `
                    <img src="${item.download_url}" onerror="this.parentElement.style.display='none'">
                    <span class="picx-name">${item.name}</span>
                `;
                div.onclick = function() {
                    selectPicXImage(item.download_url);
                };
                grid.appendChild(div);
            });
            showToast(`✅ ${images.length} images chargées`, 'success');
        }
        
        function selectPicXImage(imageUrl) {
            if (imageSelectorMode === 'logo') {
                updateLogoPreview(imageUrl);
                document.getElementById('restaurantLogo').value = imageUrl;
                showToast('✅ Logo sélectionné ! N\'oubliez pas d\'enregistrer.', 'success');
                imageSelectorMode = null;
                document.querySelector('[data-tab="tab-restaurant"]').click();
            } else if (imageSelectorMode === 'banner') {
                updateBannerPreview(imageUrl);
                document.getElementById('restaurantBanner').value = imageUrl;
                showToast('✅ Bannière sélectionnée ! N\'oubliez pas d\'enregistrer.', 'success');
                imageSelectorMode = null;
                document.querySelector('[data-tab="tab-restaurant"]').click();
            } else {
                document.getElementById('productImage').value = imageUrl;
                const preview = document.getElementById('picxPreview');
                const previewImg = document.getElementById('picxPreviewImg');
                if (preview && previewImg) {
                    previewImg.src = imageUrl;
                    preview.style.display = 'flex';
                }
                showToast('✅ Image sélectionnée', 'success');
            }
        }
        
        function loadPicXImagesForAdd() {
            imageSelectorMode = null;
            loadPicXImagesForGallery();
        }
        
        function clearPicXImage() {
            document.getElementById('productImage').value = '';
            const preview = document.getElementById('picxPreview');
            if (preview) preview.style.display = 'none';
        }
        
        function changeImage(productId) {
            imageSelectorMode = null;
            pendingProductId = productId;
            loadPicXImagesForGallery();
            showToast('📷 Sélectionnez une image pour ce produit', 'info');
        }
        
        // ============================================
        // 14. EXPORT / IMPORT / RÉINITIALISATION
        // ============================================
        function exportProducts() {
            if (products.length === 0) { 
                showToast('❌ Aucun produit à exporter', 'error'); 
                return; 
            }
            const blob = new Blob([JSON.stringify(products, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `produits_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast('✅ Export terminé !', 'success');
        }
        
        function importProducts() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!Array.isArray(imported)) throw new Error('Format invalide');
                        if (!confirm(`Importer ${imported.length} produits ?`)) return;
                        
                        const promises = imported.map(p => {
                            const np = { 
                                name: p.name, 
                                price: parseFloat(p.price) || 0, 
                                category: p.category || 'plats', 
                                description: p.description || '', 
                                image: p.image || null, 
                                visible: true, 
                                createdAt: Date.now() 
                            };
                            return productsRef.push().set(np);
                        });
                        Promise.all(promises).then(() => showToast(`✅ ${imported.length} produits importés !`, 'success'));
                    } catch (error) { 
                        showToast('❌ Fichier invalide', 'error'); 
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        function resetFirebaseProducts() {
            if (!confirm('⚠️ Réinitialiser tous les produits ?')) return;
            
            const defaultProducts = {
                'prod1': { name: "Salade César", price: 12, category: "entrees", description: "Salade, poulet, parmesan", visible: true, createdAt: Date.now() },
                'prod2': { name: "Steak Frites", price: 18, category: "plats", description: "Steak grillé, frites maison", visible: true, createdAt: Date.now() },
                'prod3': { name: "Tiramisu", price: 7, category: "desserts", description: "Café, mascarpone", visible: true, createdAt: Date.now() },
                'prod4': { name: "Coca-Cola", price: 3, category: "boissons", description: "33cl", visible: true, createdAt: Date.now() }
            };
            productsRef.set(defaultProducts)
                .then(() => showToast('✅ Produits réinitialisés !', 'success'))
                .catch(error => showToast('❌ Erreur: ' + error.message, 'error'));
        }
        
        // ============================================
        // 15. TABS
        // ============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });
        
        // ============================================
        // 16. INITIALISATION FINALE
        // ============================================
        if (document.readyState === 'complete') {
            initializeFirebase();
        } else {
            window.addEventListener('load', initializeFirebase);
        }
        
        // ============================================
        // 17. EXPOSER TOUTES LES FONCTIONS GLOBALEMENT
        // ============================================
        window.reloadAllData = reloadAllData;
        window.logoutUser = logoutUser;
        window.openImageSelector = openImageSelector;
        window.removeImage = removeImage;
        window.resetRestaurantForm = resetRestaurantForm;
        window.loadPicXImagesForGallery = loadPicXImagesForGallery;
        window.loadPicXImagesForAdd = loadPicXImagesForAdd;
        window.clearPicXImage = clearPicXImage;
        window.changeImage = changeImage;
        window.addCategory = addCategory;
        window.editCategory = editCategory;
        window.toggleCategory = toggleCategory;
        window.deleteCategory = deleteCategory;
        window.toggleVisibility = toggleVisibility;
        window.editProduct = editProduct;
        window.deleteProduct = deleteProduct;
        window.exportProducts = exportProducts;
        window.importProducts = importProducts;
        window.resetFirebaseProducts = resetFirebaseProducts;
        window.selectPicXImage = selectPicXImage;
        window.handleConfigError = handleConfigError;
        window.loadRestaurant = loadRestaurant;
        window.loadCategories = loadCategories;
        window.loadProducts = loadProducts;
        
        console.log('✅ Admin initialisé - Version corrigée avec UID');
        console.log('📊 Fonctions disponibles:');
        console.log('  - reloadAllData() : Recharger toutes les données');
        console.log('  - exportProducts() : Exporter les produits');
        console.log('  - importProducts() : Importer des produits');
        console.log('  - resetFirebaseProducts() : Réinitialiser les produits');
        console.log('🔐 UID attendu: kW1jJa76EuVPg53pwBuk58nCs1e2');
    </script>
