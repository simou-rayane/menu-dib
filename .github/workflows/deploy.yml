name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: 🔥 Generate config.js (FORCED)
        run: |
          echo "// 🔥 Configuration Firebase - Généré automatiquement" > config.js
          echo "const firebaseConfig = {" >> config.js
          echo "  apiKey: '${{ secrets.FIREBASE_API_KEY }}'," >> config.js
          echo "  authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> config.js
          echo "  databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}'," >> config.js
          echo "  projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'," >> config.js
          echo "  storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> config.js
          echo "  messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> config.js
          echo "  appId: '${{ secrets.FIREBASE_APP_ID }}'" >> config.js
          echo "};" >> config.js
          echo "" >> config.js
          echo "// Initialiser Firebase" >> config.js
          echo "if (typeof firebase !== 'undefined' && !firebase.apps.length) {" >> config.js
          echo "  firebase.initializeApp(firebaseConfig);" >> config.js
          echo "  console.log('✅ Firebase initialisé depuis config.js');" >> config.js
          echo "}" >> config.js
          echo "" >> config.js
          echo "window.firebaseConfig = firebaseConfig;" >> config.js
          
          echo ""
          echo "==========================================="
          echo "✅ config.js généré avec succès !"
          echo "==========================================="
          echo ""
          echo "📄 Contenu de config.js :"
          echo "-------------------------------------------"
          cat config.js
          echo "-------------------------------------------"
      
      - name: 📁 Vérification FORCÉE de config.js
        run: |
          echo ""
          echo "📁 Vérification des fichiers..."
          echo "-------------------------------------------"
          ls -la
          echo "-------------------------------------------"
          echo ""
          if [ -f "config.js" ]; then
            echo "✅ config.js EXISTE !"
            echo "📄 Taille : $(wc -c < config.js) bytes"
          else
            echo "❌ ERREUR : config.js n'existe pas !"
            echo "💡 Création forcée..."
            echo "// Fallback config" > config.js
            echo "const firebaseConfig = { apiKey: 'test' };" >> config.js
          fi
      
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "🚀 Déploiement - config.js généré"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      
      - name: ✅ Vérification finale
        run: |
          echo ""
          echo "==========================================="
          echo "🎉 Déploiement terminé !"
          echo "==========================================="
          echo ""
          echo "🌐 Site : https://simou-rayane.github.io/menu-dib/"
          echo "📄 config.js : https://simou-rayane.github.io/menu-dib/config.js"
