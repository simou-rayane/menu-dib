<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- ============================================ -->
    <!-- 🔥 CONFIGURATION FIREBASE -->
    <!-- ============================================ -->
    <script>
        // 🔥 Configuration Firebase (intégrée)
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAp9akZE9yGLmZAVkcZ7YB4pM1kUP8cJWM",
            authDomain: "restaurant-menu-9179b.firebaseapp.com",
            databaseURL: "https://restaurant-menu-9179b-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "restaurant-menu-9179b",
            storageBucket: "restaurant-menu-9179b.appspot.com",
            messagingSenderId: "57456460201",
            appId: "1:57456460201:web:VOTRE_APP_ID" // ⚠️ REMPLACEZ PAR VOTRE APP_ID
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG);
            console.log('✅ Firebase initialisé');
        }
    </script>
    
    <style>
        /* ============================================ */
        /* 🎨 STYLES - MODE SOMBRE PROFESSIONNEL */
        /* ============================================ */
        
        /* Variables */
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-card-hover: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #777777;
            --accent: #e8a838;
            --accent-hover: #f5c14a;
            --accent-glow: rgba(232, 168, 56, 0.15);
            --border-color: #333333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }
        
        /* ============================================ */
        /* 📱 BARRE DE RECHERCHE ET FILTRES */
        /* ============================================ */
        .search-container {
            max-width: 1200px;
            margin: 0 auto 30px;
            position: sticky;
            top: 20px;
            z-index: 100;
            background: var(--bg-primary);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        
        .search-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }
        
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            font-weight: 600;
        }
        
        .filter-btn.active:hover {
            background: var(--accent-hover);
        }
        
        /* ============================================ */
        /* 🍽️ CONTENEUR PRINCIPAL */
        /* ============================================ */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* ============================================ */
        /* 🏪 EN-TÊTE DU RESTAURANT */
        /* ============================================ */
        .restaurant-header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .restaurant-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, var(--accent-glow), transparent 70%);
            opacity: 0.3;
            pointer-events: none;
        }
        
        .restaurant-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 20px;
            position: relative;
        }
        
        .restaurant-name {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #f5d37a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            position: relative;
        }
        
        .restaurant-address {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            position: relative;
        }
        
        .restaurant-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            color: var(--text-muted);
            font-size: 0.95rem;
            position: relative;
        }
        
        .restaurant-info a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .restaurant-info a:hover {
            color: var(--accent);
        }
        
        /* ============================================ */
        /* 📂 CATÉGORIES */
        /* ============================================ */
        .category-section {
            margin-bottom: 50px;
        }
        
        .category-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            margin-bottom: 25px;
        }
        
        .category-icon {
            font-size: 28px;
        }
        
        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .category-count {
            margin-left: auto;
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        /* ============================================ */
        /* 🍽️ GRILLE DES PRODUITS */
        /* ============================================ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-secondary);
            transition: var(--transition);
        }
        
        .product-card:hover .product-image {
            transform: scale(1.02);
        }
        
        .product-body {
            padding: 20px;
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }
        
        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            background: var(--accent-glow);
            padding: 2px 12px;
            border-radius: 20px;
        }
        
        .product-description {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Badge "Nouveau" ou "Disponible" */
        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent);
            color: var(--bg-primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* ============================================ */
        /* 🛒 PANIER - FLOTTANT */
        /* ============================================ */
        .cart-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(232, 168, 56, 0.4);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }
        
        .cart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 40px rgba(232, 168, 56, 0.6);
        }
        
        .cart-badge {
            background: var(--bg-primary);
            color: var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }
        
        /* ============================================ */
        /* 🔄 CHARGEMENT */
        /* ============================================ */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        /* ============================================ */
        /* 📱 RESPONSIVE */
        /* ============================================ */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            .restaurant-header { padding: 25px 15px; }
            .restaurant-name { font-size: 1.8rem; }
            
            .search-container { padding: 15px; margin-bottom: 20px; }
            .search-bar input { font-size: 14px; padding: 12px 16px; }
            
            .products-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            
            .product-image { height: 150px; }
            .product-body { padding: 14px; }
            .product-name { font-size: 0.95rem; }
            .product-price { font-size: 1rem; }
            
            .cart-button { 
                bottom: 20px; 
                right: 20px; 
                padding: 12px 18px;
                font-size: 0.9rem;
            }
            
            .filter-btn { padding: 8px 14px; font-size: 13px; }
        }
        
        @media (max-width: 480px) {
            .products-grid { grid-template-columns: 1fr; }
            .restaurant-info { flex-direction: column; gap: 8px; }
            .filter-buttons { justify-content: center; }
        }
        
        /* ============================================ */
        /* 🔄 ANIMATIONS */
        /* ============================================ */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================ */
        /* 🏷️ SCROLLBAR PERSONNALISÉE */
        /* ============================================ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        /* ============================================ */
        /* 🌟 EFFET DE GLOW SUR LES CARTES */
        /* ============================================ */
        .product-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, transparent 40%, var(--accent-glow), transparent 60%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: -1;
        }
        
        .product-card:hover::after {
            opacity: 1;
        }
        
        /* ============================================ */
        /* 📋 STATUS MESSAGE */
        /* ============================================ */
        .status-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .status-message .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }
        
        .status-message h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    
    <!-- ============================================ -->
    <!-- 🔍 BARRE DE RECHERCHE -->
    <!-- ============================================ -->
    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher un plat..." oninput="filterProducts()">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all" onclick="filterByCategory('all')">🍽️ Tous</button>
            </div>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 🏪 MENU PRINCIPAL -->
    <!-- ============================================ -->
    <div class="menu-container">
        
        <!-- EN-TÊTE RESTAURANT -->
        <div class="restaurant-header" id="restaurantHeader">
            <img id="restaurantLogo" src="" alt="Logo" class="restaurant-logo" style="display: none;">
            <h1 class="restaurant-name" id="restaurantName">Chargement...</h1>
            <p class="restaurant-address" id="restaurantAddress"></p>
            <div class="restaurant-info" id="restaurantInfo">
                <a id="restaurantPhoneLink" href="#"><span>📞</span> Appeler</a>
                <a id="restaurantWhatsAppLink" href="#"><span>💬</span> WhatsApp</a>
                <span id="restaurantDeliveryInfo">🚚 Livraison disponible</span>
            </div>
        </div>
        
        <!-- CHARGEMENT -->
        <div id="loadingIndicator" class="loading">
            <div class="loading-spinner"></div>
            <p class="loading-text">🍽️ Chargement du menu...</p>
        </div>
        
        <!-- CATÉGORIES ET PRODUITS -->
        <div id="menuContent" style="display: none;"></div>
        
        <!-- STATUS SI AUCUN PRODUIT -->
        <div id="emptyState" class="status-message" style="display: none;">
            <span class="icon">🍽️</span>
            <h3>Aucun produit disponible</h3>
            <p>Le menu est en cours de préparation. Revenez bientôt !</p>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- 🛒 BOUTON PANIER -->
    <!-- ============================================ -->
    <button class="cart-button" id="cartButton" onclick="openCart()">
        🛒 Panier
        <span class="cart-badge" id="cartCount">0</span>
    </button>
    
    <!-- ============================================ -->
    <!-- 📜 SCRIPT PRINCIPAL -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // MENU.JS - GESTION COMPLÈTE DU MENU
        // ============================================
        
        // ============================================
        // 1. VARIABLES GLOBALES
        // ============================================
        let allProducts = [];
        let allCategories = {};
        let restaurantData = {};
        let currentCategory = 'all';
        let cart = JSON.parse(localStorage.getItem('menuCart')) || [];
        let database, restaurantsRef, categoriesRef, productsRef;
        
        const DEFAULT_RESTAURANT = 'default';
        
        // ============================================
        // 2. INITIALISATION FIREBASE
        // ============================================
        function initializeFirebase() {
            if (typeof firebase === 'undefined' || firebase.apps.length === 0) {
                console.log('⏳ Attente de Firebase...');
                setTimeout(initializeFirebase, 500);
                return;
            }
            
            console.log('✅ Firebase prêt');
            database = firebase.database();
            restaurantsRef = database.ref('restaurants');
            categoriesRef = database.ref('categories');
            productsRef = database.ref('products');
            
            // Charger les données
            loadRestaurant();
            loadCategories();
            loadProducts();
        }
        
        // ============================================
        // 3. CHARGEMENT DU RESTAURANT
        // ============================================
        function loadRestaurant() {
            restaurantsRef.child(DEFAULT_RESTAURANT).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    restaurantData = data;
                    displayRestaurant(data);
                } else {
                    console.log('📝 Aucune donnée restaurant');
                }
            });
        }
        
        function displayRestaurant(data) {
            // Nom
            const nameEl = document.getElementById('restaurantName');
            if (nameEl) nameEl.textContent = data.name || 'Mon Restaurant';
            
            // Logo
            const logoEl = document.getElementById('restaurantLogo');
            if (logoEl && data.logo) {
                logoEl.src = data.logo;
                logoEl.style.display = 'block';
                logoEl.onerror = function() { this.style.display = 'none'; };
            } else if (logoEl) {
                logoEl.style.display = 'none';
            }
            
            // Adresse
            const addressEl = document.getElementById('restaurantAddress');
            if (addressEl) addressEl.textContent = data.address || '';
            
            // Téléphone
            const phoneLink = document.getElementById('restaurantPhoneLink');
            if (phoneLink && data.phoneLink) {
                phoneLink.href = `tel:${data.phoneLink}`;
                phoneLink.innerHTML = `<span>📞</span> ${data.phone || data.phoneLink}`;
            } else if (phoneLink && data.phone) {
                phoneLink.href = `tel:${data.phone}`;
                phoneLink.innerHTML = `<span>📞</span> ${data.phone}`;
            }
            
            // WhatsApp
            const whatsappLink = document.getElementById('restaurantWhatsAppLink');
            if (whatsappLink && data.whatsapp) {
                whatsappLink.href = `https://wa.me/${data.whatsapp}`;
                whatsappLink.innerHTML = `<span>💬</span> WhatsApp`;
            }
            
            // Livraison
            const deliveryInfo = document.getElementById('restaurantDeliveryInfo');
            if (deliveryInfo) {
                if (data.deliveryAvailable) {
                    const price = data.deliveryPrice ? ` (${data.deliveryPrice}€)` : '';
                    deliveryInfo.textContent = `🚚 Livraison disponible${price}`;
                } else {
                    deliveryInfo.textContent = '🚫 Livraison non disponible';
                }
            }
        }
        
        // ============================================
        // 4. CHARGEMENT DES CATÉGORIES
        // ============================================
        function loadCategories() {
            categoriesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allCategories = data;
                } else {
                    allCategories = {};
                }
                updateFilterButtons();
            });
        }
        
        function updateFilterButtons() {
            const container = document.getElementById('filterButtons');
            if (!container) return;
            
            // Garder le bouton "Tous"
            const allBtn = container.querySelector('[data-category="all"]');
            container.innerHTML = '';
            container.appendChild(allBtn);
            
            // Ajouter les catégories actives
            const sortedKeys = Object.keys(allCategories)
                .filter(key => allCategories[key].active !== false)
                .sort((a, b) => (allCategories[a].order || 0) - (allCategories[b].order || 0));
            
            sortedKeys.forEach(key => {
                const cat = allCategories[key];
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = key;
                btn.textContent = `${cat.icon || '📁'} ${cat.name}`;
                btn.onclick = () => filterByCategory(key);
                container.appendChild(btn);
            });
        }
        
        // ============================================
        // 5. CHARGEMENT DES PRODUITS
        // ============================================
        function loadProducts() {
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allProducts = Object.keys(data)
                        .map(key => ({ id: key, ...data[key] }))
                        .filter(p => p.visible !== false);
                } else {
                    allProducts = [];
                }
                renderMenu();
            });
        }
        
        // ============================================
        // 6. AFFICHAGE DU MENU
        // ============================================
        function renderMenu() {
            const container = document.getElementById('menuContent');
            const loading = document.getElementById('loadingIndicator');
            const empty = document.getElementById('emptyState');
            
            if (!container) return;
            
            // Cacher le chargement
            if (loading) loading.style.display = 'none';
            
            // Filtrer les produits
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const filtered = allProducts.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm) || 
                                   (p.description && p.description.toLowerCase().includes(searchTerm));
                return matchCategory && matchSearch;
            });
            
            // Si aucun produit
            if (filtered.length === 0) {
                container.innerHTML = '';
                if (empty) empty.style.display = 'block';
                container.style.display = 'none';
                return;
            }
            if (empty) empty.style.display = 'none';
            container.style.display = 'block';
            
            // Grouper par catégorie
            const grouped = {};
            filtered.forEach(p => {
                const catKey = p.category || 'autres';
                if (!grouped[catKey]) grouped[catKey] = [];
                grouped[catKey].push(p);
            });
            
            // Trier les catégories
            const sortedCategories = Object.keys(grouped)
                .sort((a, b) => (allCategories[a]?.order || 999) - (allCategories[b]?.order || 999));
            
            // Générer le HTML
            let html = '';
            sortedCategories.forEach(catKey => {
                const cat = allCategories[catKey] || { name: catKey, icon: '📁' };
                const products = grouped[catKey];
                
                html += `
                    <div class="category-section fade-in">
                        <div class="category-header">
                            <span class="category-icon">${cat.icon || '📁'}</span>
                            <h2 class="category-title">${cat.name}</h2>
                            <span class="category-count">${products.length}</span>
                        </div>
                        <div class="products-grid">
                `;
                
                products.forEach(p => {
                    const price = parseFloat(p.price) || 0;
                    html += `
                        <div class="product-card fade-in" onclick="addToCart('${p.id}')">
                            ${p.image ? `<img src="${p.image}" class="product-image" alt="${p.name}" onerror="this.style.display='none'">` : 
                                `<div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text-muted);background:var(--bg-secondary);">🍽️</div>`}
                            <div class="product-body">
                                <div class="product-header">
                                    <span class="product-name">${p.name}</span>
                                    <span class="product-price">${price.toFixed(2)} €</span>
                                </div>
                                ${p.description ? `<p class="product-description">${p.description}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            updateCartBadge();
        }
        
        // ============================================
        // 7. FILTRES ET RECHERCHE
        // ============================================
        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            renderMenu();
        }
        
        function filterProducts() {
            renderMenu();
        }
        
        // ============================================
        // 8. PANIER
        // ============================================
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: parseFloat(product.price) || 0,
                    quantity: 1,
                    image: product.image || null
                });
            }
            
            localStorage.setItem('menuCart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`✅ ${product.name} ajouté au panier`);
        }
        
        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            if (badge) {
                const total = cart.reduce((sum, item) => sum + item.quantity, 0);
                badge.textContent = total;
            }
        }
        
        function openCart() {
            if (cart.length === 0) {
                showToast('🛒 Votre panier est vide');
                return;
            }
            
            let total = 0;
            let items = cart.map(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                return `${item.name} x${item.quantity} = ${subtotal.toFixed(2)}€`;
            }).join('\n');
            
            const message = `🛒 Mon panier :\n\n${items}\n\nTotal : ${total.toFixed(2)}€`;
            alert(message);
        }
        
        // ============================================
        // 9. TOAST
        // ============================================
        function showToast(message) {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-card);
                color: var(--text-primary);
                padding: 14px 28px;
                border-radius: 12px;
                border: 1px solid var(--accent);
                box-shadow: 0 8px 30px rgba(0,0,0,0.5);
                font-size: 0.95rem;
                z-index: 9999;
                animation: fadeIn 0.3s ease;
                max-width: 90%;
                text-align: center;
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
        
        // ============================================
        // 10. INITIALISATION
        // ============================================
        if (document.readyState === 'complete') {
            initializeFirebase();
        } else {
            window.addEventListener('load', initializeFirebase);
        }
        
        // Exposer les fonctions globalement
        window.filterByCategory = filterByCategory;
        window.filterProducts = filterProducts;
        window.addToCart = addToCart;
        window.openCart = openCart;
        
        console.log('✅ Menu chargé - Mode sombre professionnel');
    </script>
</body>
</html>
